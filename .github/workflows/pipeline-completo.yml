# ============================================================================
# Desafio Integrado & Tarefa Final: Pipeline Completo CI/CD + DevSecOps
# Requisitos atendidos:
# 1. Roda em paralelo:
#    - Testes unitários (JUnit 5 + JaCoCo > 85%)
#    - Testes de integração com TestContainers (PostgreSQL 16 em Docker)
#    - Verificação de segurança (OWASP Dependency-Check + consulta CVE OSV.dev)
# 2. Só faz deploy se:
#    - Todos os testes (unitários e integração) passarem
#    - Cobertura > 85% (validado via jacoco:check com limite 0.86)
#    - Não houver vulnerabilidades nas dependências (OWASP Dependency-Check)
# ============================================================================

name: Pipeline Completo CI/CD (Desafio Integrado)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: 1. Build & Static Analysis (Checkstyle + PMD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile & Verify Static Analysis (Checkstyle + PMD)
        run: mvn clean test-compile checkstyle:check pmd:pmd pmd:check -B

  unit-tests:
    name: 2a. Unit Tests & Coverage (> 85%)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit Tests & Enforce Coverage > 85%
        run: mvn test jacoco:report jacoco:check -Djacoco.minimum=0.86 -B

      - name: Upload JaCoCo HTML/XML Report
        uses: actions/upload-artifact@v4
        with:
          name: desafio-jacoco-report
          path: target/site/jacoco/

  integration-tests:
    name: 2b. Integration Tests (TestContainers + PostgreSQL)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run TestContainers Integration Tests
        run: mvn verify -Pintegration-tests -DskipUnitTests=true -Djacoco.minimum=0.00 -B

  owasp-security-check:
    name: 2c. Security Scan (OWASP Dependency-Check)
    needs: build
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache OWASP Dependency-Check NVD Database
        if: env.NVD_API_KEY != ''
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-dc-data-${{ runner.os }}
          restore-keys: |
            owasp-dc-data-

      - name: Run OWASP Dependency-Check Maven Plugin (with NVD API Key)
        if: env.NVD_API_KEY != ''
        run: mvn dependency-check:check -B

      - name: Upload OWASP Dependency-Check Report
        if: env.NVD_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report.*

      - name: Run Maven Dependency CVE Audit via OSV Database (Fallback when NVD_API_KEY unset)
        if: env.NVD_API_KEY == ''
        run: |
          echo "NVD_API_KEY nao configurado nos Secrets; executando auditoria de CVEs das dependencias Maven via OSV.dev..."
          mkdir -p target
          mvn dependency:list -DoutputFile=target/deps.txt -DincludeScope=test -B
          python3 - << 'EOF'
          import json, re, sys, urllib.request

          queries = []
          coords = []
          with open("target/deps.txt", encoding="utf-8") as f:
              for line in f:
                  m = re.search(r"^\s*([a-zA-Z0-9._-]+):([a-zA-Z0-9._-]+):[a-zA-Z0-9._-]+:([a-zA-Z0-9._-]+):", line)
                  if m:
                      g, a, v = m.group(1), m.group(2), m.group(3)
                      pkg = f"{g}:{a}"
                      coords.append((pkg, v))
                      queries.append({"package": {"name": pkg, "ecosystem": "Maven"}, "version": v})

          if not queries:
              print("Nenhuma dependencia listada em target/deps.txt")
              sys.exit(1)

          print(f"Verificando {len(queries)} dependencias Maven contra o banco de vulnerabilidades OSV/NVD...")
          req = urllib.request.Request(
              "https://api.osv.dev/v1/querybatch",
              data=json.dumps({"queries": queries}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              results = json.loads(resp.read().decode("utf-8")).get("results", [])

          vulns_found = []
          for (pkg, ver), res in zip(coords, results):
              vulns = res.get("vulns", [])
              if vulns:
                  ids = ", ".join(v.get("id", "UNKNOWN") for v in vulns)
                  vulns_found.append(f"{pkg}:{ver} -> {ids}")

          if vulns_found:
              print("VULNERABILIDADES DETECTADAS:")
              for item in vulns_found:
                  print(" -", item)
              sys.exit(1)

          print("Zero vulnerabilidades encontradas em todas as dependencias do projeto!")
          EOF

  deploy:
    name: 3. Conditional Deploy (Docker & Kubernetes)
    needs: [unit-tests, integration-tests, owasp-security-check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Production Docker Image
        run: docker build -t aula10-iqs:${{ github.sha }} .

      - name: Smoke Test Container Health Endpoint
        run: |
          docker run -d --name aula10-smoke -p 8080:8080 aula10-iqs:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health; then
              echo ""
              echo "Healthcheck do container validado com sucesso!"
              docker rm -f aula10-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs aula10-smoke
          docker rm -f aula10-smoke
          exit 1

      - name: Validate Kubernetes Deployment & Service Manifests
        run: |
          kubectl apply --dry-run=client --validate=false -f k8s/deployment.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/service.yaml
