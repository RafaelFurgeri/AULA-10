# ============================================================================
# Atividade 1: Pipeline CI com GitHub Actions (+ Exercícios)
# - Build com Maven e JDK 17 (Temurin)
# - Execução de Testes Unitários
# - Verificação de Qualidade com Checkstyle (continue-on-error: false)
# - Exercício 1: Geração e publicação de relatório de cobertura JaCoCo
# - Quality Gate com SonarQube
# - Exercício 2: Approval manual antes do deploy via GitHub Environment (staging)
# ============================================================================

name: Java CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test, Checkstyle & JaCoCo
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Run Unit Tests & Generate JaCoCo Report
        run: mvn test jacoco:report jacoco:check -B

      - name: Code Quality Check (Checkstyle)
        run: mvn checkstyle:check -B
        continue-on-error: false

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-ci-coverage-report
          path: target/site/jacoco/

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      - name: SonarQube Configuration Notice
        if: env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == ''
        run: |
          echo "Secrets SONAR_TOKEN / SONAR_HOST_URL nao configurados neste repositorio."
          echo "Quality Gates locais (JaCoCo > 85% e Checkstyle) ja foram validados com sucesso."

  # Exercício 2 (Atividade 1): Approval manual antes do deploy via GitHub Environment
  # Para ativar bloqueio humano obrigatório: Settings -> Environments -> staging -> Required reviewers
  deploy-staging:
    name: Deploy to Staging (Manual Approval Ready)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t myapp:${{ github.sha }} .

      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client --validate=false -f k8s/deployment.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/service.yaml
