# Configuração do SonarQube - Aula 10 (IQS)
sonar.projectKey=RafaelFurgeri_AULA-10
sonar.projectName=Aula 10 - CI/CD com Automacao de Qualidade
sonar.projectVersion=1.0.0

# Diretórios de código-fonte e testes
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.source=17
sonar.sourceEncoding=UTF-8

# Relatórios de cobertura (JaCoCo) e testes (JUnit)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports,target/failsafe-reports

# Relatórios de análise estática (Checkstyle e PMD)
sonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
sonar.java.pmd.reportPaths=target/pmd.xml

# Regras de Quality Gate esperadas no servidor SonarQube (Atividade 3 & Desafio):
# - Cobertura mínima: >= 80% (Desafio Integrado: > 85%)
# - Zero bugs críticos (New Critical Issues = 0)
# - Debt técnico < 1h (Technical Debt < 60 min)
